<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Moon Machines</title>
<meta name="description" content="Moon Machines — a collection of machines with faces.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg:#090b10; --panel:#121821; --ice:#f4f6f8; --mute:#8a98a8; --line:rgba(255,255,255,.1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--ice);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100dvh;
  }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 24px 80px; }
  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 0 18px; color:var(--mute);
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  }
  header a:hover { color:var(--ice); }
  .scene {
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    overflow:hidden;
    background:var(--panel);
    aspect-ratio:16/9;
    max-height:min(62vh, 720px);
  }
  .scene img { width:100%; height:100%; object-fit:cover; display:block; }
  .intro {
    display:grid; gap:14px; padding:36px 0 8px; max-width:36rem;
  }
  .kicker {
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--mute);
  }
  h1 {
    font-size:clamp(40px,7vw,64px); font-weight:500;
    letter-spacing:-.02em; line-height:.95;
  }
  .lede { color:#b8c3ce; font-size:17px; line-height:1.55; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .pill {
    display:inline-flex; align-items:center; padding:10px 14px; border-radius:999px;
    border:1px solid var(--line); color:var(--mute);
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  }
  .pill.live { color:var(--ice); border-color:rgba(255,255,255,.22); }
  a.pill.live:hover { background:rgba(255,255,255,.06); }
  .section-head {
    display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; margin:48px 0 20px; padding-top:20px;
    border-top:1px solid var(--line);
  }
  .section-head h2 {
    font-size:12px; letter-spacing:.28em; text-transform:uppercase; font-weight:500;
  }
  .section-head p { color:var(--mute); font-size:12px; letter-spacing:.08em; }
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:20px;
  }
  .card {
    background:var(--panel); border:1px solid var(--line);
    border-radius:18px; overflow:hidden; display:block; width:100%;
    transition:border-color 140ms ease, transform 140ms ease;
  }
  .card:hover { border-color:rgba(255,255,255,.28); transform:translateY(-3px); }
  .card:focus-visible { outline:2px solid rgba(255,255,255,.45); outline-offset:3px; }
  .card img {
    width:100%; aspect-ratio:1; object-fit:cover; object-position:center center; display:block;
  }
  .card span {
    display:block; padding:12px 14px 14px; color:var(--mute);
    font-size:12px; letter-spacing:.14em;
  }
  footer {
    margin-top:56px; padding-top:20px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    color:var(--mute); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  }
  .lightbox {
    position:fixed; inset:0; z-index:80;
    display:none; align-items:center; justify-content:center;
    padding:24px; background:rgba(5,7,12,.88);
    backdrop-filter:blur(8px);
  }
  .lightbox.open { display:flex; }
  .lightbox figure {
    margin:0; max-width:min(92vw, 880px); max-height:92vh;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .lightbox img {
    display:block; width:min(92vw, 880px); height:min(82vh, 880px);
    object-fit:contain; object-position:center center;
    border-radius:18px; background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .lightbox figcaption {
    color:var(--mute); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  }
  .lightbox-close {
    position:fixed; top:18px; right:18px; z-index:81;
    width:42px; height:42px; border-radius:999px;
    border:1px solid rgba(255,255,255,.2); color:var(--ice);
    background:rgba(9,11,16,.55);
  }
  .lightbox-close:hover { background:rgba(255,255,255,.1); }
  body.lb-open { overflow:hidden; }
  @media (max-width:640px) {
    .wrap { padding:0 16px 64px; }
    .grid { grid-template-columns:repeat(2,1fr); gap:14px; }
    .card { border-radius:14px; }
  }
</style>

    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <figure>
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <script>
  (function () {
    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var cap = document.getElementById('lightbox-cap');
    var closeBtn = lb.querySelector('.lightbox-close');

    function openLb(src, alt) {
      img.src = src;
      img.alt = alt || '';
      cap.textContent = alt || '';
      lb.hidden = false;
      lb.classList.add('open');
      document.body.classList.add('lb-open');
      closeBtn.focus();
    }
    function closeLb() {
      lb.classList.remove('open');
      lb.hidden = true;
      document.body.classList.remove('lb-open');
      img.removeAttribute('src');
    }

    document.querySelectorAll('.card[data-full]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openLb(btn.getAttribute('data-full'), btn.getAttribute('data-alt'));
      });
    });
    closeBtn.addEventListener('click', closeLb);
    lb.addEventListener('click', function (e) {
      if (e.target === lb) closeLb();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lb.classList.contains('open')) closeLb();
    });
  })();
  </script>
